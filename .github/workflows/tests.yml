name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Standard-library unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Offline frontend regression tests
        run: node tests/frontend_regression.cjs
      - name: Offline source launch and shutdown
        run: python -B packaging/smoke_test.py --source
